<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Landing page layout checks</title>
<pre id="result">Running...</pre>
<iframe id="page" title="Landing page preview" src="../index.html" style="height: 700px; border: 0"></iframe>
<script>
  const page = document.querySelector('#page');
  const result = document.querySelector('#result');
  const assert = (condition, message) => { if (!condition) throw new Error(message); };

  page.onload = () => {
    try {
      const doc = page.contentDocument;
      const win = page.contentWindow;
      const roles = doc.querySelector('.roles');
      const items = [...roles.querySelectorAll('li')];
      assert(items.map(item => item.textContent).join('|') === 'Sound Designer|Composer|DJ|Photographer', 'Incorrect role order');
      const fox = doc.querySelector('.fox');
      assert(fox?.getAttribute('aria-hidden') === 'true' && /^[\x00-\x7F]+$/.test(fox.textContent), 'Fox must be decorative ASCII');
      assert(fox.textContent.trimEnd().endsWith(' | | |    /\n (_|_)___/'), 'Fox must have two front paws');
      const profiles = new Map([
        ['500px', 'https://500px.com/p/Eternal_soul'],
        ['Instagram', 'https://www.instagram.com/luchiana_solovieva/'],
        ['SoundCloud', 'https://soundcloud.com/luchiana-solovieva'],
        ['Bandcamp', 'https://luchiana.bandcamp.com/'],
      ]);
      const socialLinks = [...doc.querySelectorAll('.socials a')];
      assert(socialLinks.length === profiles.size, 'All social profiles must have a link');
      assert(doc.querySelector('nav.socials')?.getAttribute('aria-label') === 'Social profiles', 'Social links must have a named navigation landmark');
      for (const [index, [name, url]] of [...profiles].entries()) {
        const link = socialLinks[index];
        assert(link.getAttribute('aria-label') === name && link.href === url, `Incorrect social link: ${name}`);
        const icon = link.querySelector('svg');
        assert(icon?.getAttribute('aria-hidden') === 'true' && icon.querySelector('path')?.getAttribute('d'), `${name} must have a decorative inline SVG`);
      }

      for (const width of [320, 375, 768, 1280]) {
        page.style.width = `${width}px`;
        const bounds = roles.getBoundingClientRect();
        assert(doc.documentElement.scrollWidth <= width, `Page overflows at ${width}px`);
        for (const link of socialLinks) {
          const box = link.getBoundingClientRect();
          assert(box.width >= 44 && box.height >= 44, `Social link is too small at ${width}px`);
        }
        assert(win.getComputedStyle(roles).overflowX === 'hidden', 'Row-edge separators must be clipped');
        let previous;
        for (const item of items) {
          const box = item.getBoundingClientRect();
          const separator = win.getComputedStyle(item, '::before');
          const left = box.left + parseFloat(separator.left);
          const right = left + parseFloat(separator.width);
          const firstInRow = !previous || Math.abs(previous.top - box.top) > 1;
          assert(separator.content.includes('·'), 'Missing role separator');
          assert(win.getComputedStyle(item).whiteSpace === 'nowrap', 'Role names must not split');
          assert(firstInRow ? right <= bounds.left + 1 : left >= previous.right - 1 && right <= box.left, `Separator escapes its gap at ${width}px`);
          previous = box;
        }
      }
      result.textContent = 'PASS: social links, ASCII fox and role separators at 320, 375, 768 and 1280px';
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
      throw error;
    } finally {
      page.style.width = '100%';
    }
  };
</script>
</html>
