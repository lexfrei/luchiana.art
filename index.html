  <style>
    @font-face {
      font-family: "Unbounded";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/unbounded-cyrillic-400.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Unbounded";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/unbounded-latin-400.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --bg: #14161A;
      --accent: #FF7A1A;
      --secondary: #7EC8E3;
      --text: #F2EFE9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Unbounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    h1 {
      color: var(--accent);
      font-size: clamp(1.875rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-left: 0.25em; /* optically recenters letter-spaced text */
    }
    .roles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em 1.4em;
      max-width: 100%;
      overflow: hidden;
      list-style: none;
      color: var(--secondary);
      font-size: clamp(0.9rem, 3vw, 1.25rem);
      letter-spacing: 0.15em;
      margin-top: 1.25rem;
    }
    .roles li {
      position: relative;
      flex-grow: 1; /* Full rows keep leading separators outside the clip. */
      white-space: nowrap;
    }
    .roles li::before {
      content: "·" / "";
      position: absolute;
      left: -1.2em;
      width: 1em;
    }
    .fox {
      color: var(--accent);
      font: 0.85rem/1.2 ui-monospace, monospace;
      text-align: left;
      margin-top: 2rem;
    }
    hr {
      border: none;
      width: 4rem;
      height: 1px;
      background: var(--text);
      opacity: 0.35;
      margin: 2.5rem auto 0;
    }
    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--secondary);
      border-radius: 0.25rem;
    }
    .socials a:hover,
    .socials a:focus-visible {
      color: var(--accent);
    }
    .socials a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .socials svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .socials a[aria-label="500px"] svg {
      width: 40px;
      height: 40px;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
