<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luchiana — DJ, Composer, Sound Designer, Photographer</title>
  <meta name="description" content="Luchiana — DJ, composer, sound designer and photographer.">
  <meta property="og:title" content="Luchiana">
  <meta property="og:description" content="DJ · Composer · Sound Designer · Photographer">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luchiana.art">
  <style>
    :root {
      --bg: #14161A;
      --accent: #FF7A1A;
      --secondary: #7EC8E3;
      --text: #F2EFE9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    h1 {
      color: var(--accent);
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-left: 0.25em; /* optically recenters letter-spaced text */
    }
    .roles {
      color: var(--secondary);
      font-size: clamp(0.9rem, 3vw, 1.25rem);
      letter-spacing: 0.15em;
      margin-top: 1.25rem;
    }
    hr {
      border: none;
      width: 4rem;
      height: 1px;
      background: var(--text);
      opacity: 0.35;
      margin: 2.5rem auto 0;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Luchiana</h1>
    <p class="roles">DJ · Composer · Sound Designer · Photographer</p>
    <hr>
  </main>
  <footer>&copy; 2026 Luchiana</footer>
</body>
</html>
